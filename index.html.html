<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overlay TikTok — regalos en movimiento</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; width: 100%; height: 100%;
    overflow: hidden; background: transparent;
  }
  .viewport {
    position: fixed; inset: 0 0 auto 0;
    width: 100vw; height: 12vw; max-height: 120px; min-height: 48px;
    overflow: hidden; background: transparent;
    display: flex; align-items: center;
  }
  .track {
    display: flex; align-items: center; width: 200vw; flex: 0 0 200vw;
    animation: scroll-left 22s linear infinite;
    will-change: transform;
  }
  .track img {
    display: block; flex: 0 0 100vw; width: 100vw; height: auto;
    max-height: 100%; object-fit: contain;
  }
  @keyframes scroll-left {
    from { transform: translateX(0); }
    to { transform: translateX(-100vw); }
  }
  @media (prefers-reduced-motion: reduce) {
    .track { animation-duration: 22s; }
  }
</style>
